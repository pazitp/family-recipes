# ייצוא כל המתכונים ל-data/recipes.json (קריאה בלבד מ-Firestore).
name: export-recipes

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  workflow_run:
    workflows: [add-recipe]
    types: [completed]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: export-recipes
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == 'pazitp' &&
       startsWith(github.event.issue.title, 'ייצוא'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin@12 --no-save --no-audit --no-fund
        working-directory: scripts
      - run: node export-recipes.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recipes.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "עדכון ייצוא מתכונים"
            git pull --rebase
            git push
          fi
      - name: comment and close issue (success)
        if: github.event_name == 'issues' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "✔ המתכונים יוצאו ל-data/recipes.json"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
      - name: comment with log link (failure)
        if: github.event_name == 'issues' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "❌ הייצוא נכשל: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
